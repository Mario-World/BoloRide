services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bolo_ride
      POSTGRES_USER: bolo
      POSTGRES_PASSWORD: local-demo-password
    ports:
      - "5432:5432"
    volumes:
      - bolo-ride-demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolo -d bolo_ride"]
      interval: 3s
      timeout: 3s
      retries: 20

  business-api:
    build:
      context: ./services/business-api
    environment:
      DATABASE_URL: postgresql+asyncpg://bolo:local-demo-password@database:5432/bolo_ride
      BUSINESS_API_KEY: ${BUSINESS_API_KEY:-local-demo-only-change-before-deploy}
      MOCK_PAYMENTS_ENABLED: "true"
    ports:
      - "8010:8010"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: oven/bun:1
    working_dir: /workspace/bolo-ride-voice/web
    command: sh -c "bun install && bun run dev -- --hostname 0.0.0.0"
    environment:
      BUSINESS_API_URL: http://business-api:8010
      BUSINESS_API_KEY: ${BUSINESS_API_KEY:-local-demo-only-change-before-deploy}
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    depends_on:
      business-api:
        condition: service_healthy

volumes:
  bolo-ride-demo-data:
